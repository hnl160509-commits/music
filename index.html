<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Music — HNL160509</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{
  background:#080b13 url("background.png") center/cover fixed no-repeat;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:rgba(4,7,14,.45);
  backdrop-filter:blur(2px);
}
.page{width:min(1180px,94%);margin:auto;padding:55px 0 45px}
.hero{text-align:center;margin-bottom:38px;text-shadow:0 3px 25px #000}
.hero h1{
  margin:0 0 8px;font-family:cursive;font-size:clamp(52px,8vw,90px);
  font-weight:500;letter-spacing:1px
}
.hero p{margin:0;color:#ddd;letter-spacing:4px;font-size:13px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{
  overflow:hidden;border:1px solid rgba(255,255,255,.38);
  border-radius:25px;background:rgba(7,12,22,.68);
  box-shadow:0 22px 65px rgba(0,0,0,.45);
  backdrop-filter:blur(12px);transition:.3s ease
}
.card:hover{transform:translateY(-8px);border-color:rgba(255,255,255,.65)}
.cover{
  width:100%;height:285px;object-fit:cover;display:block;
  background:#151927
}
.info{padding:21px 22px 23px}
.small{font-size:11px;letter-spacing:2.5px;color:#bbb;text-transform:uppercase;margin-bottom:10px}
h2{margin:0 0 8px;font-size:22px;line-height:1.25}
.artist{color:#bfc1ca;font-size:13px;margin-bottom:20px}
.btn{
  display:block;text-align:center;text-decoration:none;color:#111;
  background:#fff;border-radius:14px;padding:13px 16px;font-weight:700;
  transition:.2s
}
.btn:hover{background:#e9e7ff;transform:scale(1.02)}
footer{text-align:center;color:#ddd;opacity:.7;font-size:12px;margin-top:30px}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:580px){
  .page{padding-top:35px}.grid{grid-template-columns:1fr}
  .cover{height:300px}.hero h1{font-size:58px}
}
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <h1>My Music</h1>
    <p>A little bit of my world through music</p>
  </header>

  <main class="grid">
    <article class="card">
      <img class="cover" src="cover1.jpg" alt="우산 아래서">
      <div class="info">
        <div class="small">01 · Suno AI</div>
        <h2>우산 아래서</h2>
        <div class="artist">hnl160509</div>
        <a class="btn" href="https://suno.com/s/aOStRENTb3FA6seo" target="_blank" rel="noopener">▶ Nghe bài hát</a>
      </div>
    </article>

    <article class="card">
      <img class="cover" src="cover2.jpg" alt="우리의 푸른 계절">
      <div class="info">
        <div class="small">02 · Suno AI</div>
        <h2>우리의 푸른 계절</h2>
        <div class="artist">hnl160509</div>
        <a class="btn" href="https://suno.com/s/GTnvrv9jjSNR4Yqb" target="_blank" rel="noopener">▶ Nghe bài hát</a>
      </div>
    </article>

    <article class="card">
      <img class="cover" src="cover3.jpg" alt="Late Night Bossa Nova">
      <div class="info">
        <div class="small">03 · Suno AI</div>
        <h2>Late Night Bossa Nova</h2>
        <div class="artist">hnl160509</div>
        <a class="btn" href="https://suno.com/s/Dkk3HZc8bnDLO7QL" target="_blank" rel="noopener">▶ Nghe bài hát</a>
      </div>
    </article>
  </main>

  <footer>© 2026 HNL160509 · Music Collection</footer>
</div>
</body>
</html>
